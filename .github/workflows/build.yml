name: Build DevFlow app and IntelliJ plugin
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile standalone app for Java 8
        run: sh build.sh
      - name: Verify lessons, scoring, app flows, CLI and persistence
        run: npm test
      - name: Upload standalone Java app
        uses: actions/upload-artifact@v4
        with:
          name: devflow-jar
          path: devflow.jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Smoke test the standalone app on Java 8
        run: node --test tests/server.test.mjs tests/cli.test.mjs
  benchlab:
    name: Verify optional JMH laboratory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile JMH harness and package standalone benchmark
        run: mvn -B -ntp -f perf-lab/pom.xml -DskipTests package
      - name: Confirm JMH discovers real benchmarks
        run: java -jar perf-lab/target/benchmarks.jar -l | grep AllocationBenchmark
  intellij:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: devflow-jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Compile and package the IntelliJ plugin
        run: gradle --no-daemon -p intellij-plugin buildPlugin verifyPluginStructure runtimeSmoke -x buildSearchableOptions
      - name: Upload installable IntelliJ plugin
        uses: actions/upload-artifact@v4
        with:
          name: devflow-intellij
          path: intellij-plugin/build/distributions/*.zip

  publish:
    name: Publish tested local binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, intellij, benchlab]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: devflow-jar
          path: artifacts/standalone
      - uses: actions/download-artifact@v4
        with:
          name: devflow-intellij
          path: artifacts/plugin
      - name: Publish verified JAR and installable IntelliJ ZIP to main
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/standalone/devflow.jar
          test -s artifacts/plugin/devflow-intellij-2.2.0.zip
          cp artifacts/standalone/devflow.jar devflow.jar
          mkdir -p downloads
          cp artifacts/plugin/devflow-intellij-2.2.0.zip downloads/devflow-intellij-2.2.0.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devflow.jar downloads/devflow-intellij-2.2.0.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified DevFlow 2.2 binaries [skip ci]"
            git push origin HEAD:main
          fi
