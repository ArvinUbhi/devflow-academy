name: Build DevFlow app and IntelliJ plugin
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile standalone app for Java 8
        run: sh build.sh
      - name: Verify lessons, scoring, app flows, CLI and persistence
        run: npm test
      - name: Upload standalone Java app
        uses: actions/upload-artifact@v4
        with:
          name: devflow-jar
          path: devflow.jar
      - name: Package the offline work download
        run: python scripts/package-work.py
      - uses: actions/upload-artifact@v4
        with:
          name: devflow-work
          path: downloads/devflow-work-*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Smoke test the standalone app on Java 8
        run: node --test tests/server.test.mjs tests/cli.test.mjs tests/launcher.test.mjs
  launcher:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            java: '8'
          - os: macos-15-intel
            java: '8'
          - os: macos-latest
            java: '17'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: devflow-jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Launch the downloaded folder with no npm installation
        run: node --test --test-timeout=60000 tests/launcher.test.mjs
  intellij:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: devflow-jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Compile and package the IntelliJ plugin
        run: gradle --no-daemon -p intellij-plugin buildPlugin verifyPluginStructure runtimeSmoke -x buildSearchableOptions
      - name: Upload installable IntelliJ plugin
        uses: actions/upload-artifact@v4
        with:
          name: devflow-intellij
          path: intellij-plugin/build/distributions/*.zip
